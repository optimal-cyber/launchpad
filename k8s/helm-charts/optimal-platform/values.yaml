# =============================================================================
# Optimal Platform Helm Chart Values
# Enterprise DevSecOps Platform
# =============================================================================

# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------
global:
  # Image registry (override for private registries)
  imageRegistry: ""
  # Image pull secrets
  imagePullSecrets: []
  # Storage class for persistent volumes
  storageClass: ""
  # Domain configuration
  domain: "gooptimal.io"
  # Environment
  environment: "development"

# -----------------------------------------------------------------------------
# Portal (Next.js Frontend)
# -----------------------------------------------------------------------------
portal:
  enabled: true
  replicaCount: 2
  
  image:
    repository: optimal-platform/portal
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
  
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: portal.gooptimal.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: portal-tls
        hosts:
          - portal.gooptimal.io
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
  env:
    NEXT_PUBLIC_API_BASE: "https://api.gooptimal.io"
    NEXT_PUBLIC_KEYCLOAK_URL: "https://keycloak.gooptimal.io"
    NEXT_PUBLIC_KEYCLOAK_REALM: "optimal"
    NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "optimal-portal"

# -----------------------------------------------------------------------------
# API Gateway (FastAPI)
# -----------------------------------------------------------------------------
apiGateway:
  enabled: true
  replicaCount: 2
  
  image:
    repository: optimal-platform/api-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
  
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    hosts:
      - host: api.gooptimal.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-tls
        hosts:
          - api.gooptimal.io
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  
  env:
    DATABASE_URL: ""
    REDIS_URL: ""
    JWT_SECRET: ""

# -----------------------------------------------------------------------------
# SBOM Service
# -----------------------------------------------------------------------------
sbomService:
  enabled: true
  replicaCount: 2
  
  image:
    repository: optimal-platform/sbom-service
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  env:
    DATABASE_URL: ""
    REDIS_URL: ""

# -----------------------------------------------------------------------------
# Vulnerability Service
# -----------------------------------------------------------------------------
vulnService:
  enabled: true
  replicaCount: 2
  
  image:
    repository: optimal-platform/vuln-service
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  env:
    DATABASE_URL: ""
    REDIS_URL: ""

# -----------------------------------------------------------------------------
# GitLab Listener
# -----------------------------------------------------------------------------
gitlabListener:
  enabled: true
  replicaCount: 1
  
  image:
    repository: optimal-platform/gitlab-listener
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  
  env:
    GITLAB_TOKEN: ""
    SBOM_SERVICE_URL: "http://sbom-service:8000"
    VULN_SERVICE_URL: "http://vuln-service:8000"

# -----------------------------------------------------------------------------
# Worker Service
# -----------------------------------------------------------------------------
worker:
  enabled: true
  replicaCount: 2
  
  image:
    repository: optimal-platform/worker
    tag: "latest"
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  env:
    DATABASE_URL: ""
    REDIS_URL: ""

# -----------------------------------------------------------------------------
# Runtime Security Agent (DaemonSet) - Platform Side
# Note: For tenant-side agents, use the separate optimal-agent Helm chart
# -----------------------------------------------------------------------------
securityAgent:
  enabled: true

  image:
    repository: optimal-platform/runtime-security-agent
    tag: "latest"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

  tolerations:
    - operator: Exists

  env:
    API_GATEWAY_URL: "http://api-gateway:8000"

# -----------------------------------------------------------------------------
# Tenant Service (Multi-tenant Management)
# -----------------------------------------------------------------------------
tenantService:
  enabled: true
  replicaCount: 2

  image:
    repository: optimal-platform/tenant-service
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  env:
    PLATFORM_DATABASE_URL: ""
    KEYCLOAK_URL: ""
    KEYCLOAK_ADMIN_USERNAME: ""
    KEYCLOAK_ADMIN_PASSWORD: ""

# -----------------------------------------------------------------------------
# Multi-tenancy Configuration
# -----------------------------------------------------------------------------
multiTenancy:
  enabled: true

  # Database isolation strategy
  databaseIsolation: "database"  # database (separate DB per tenant) or schema (separate schema per tenant)

  # Tenant database provisioning
  tenantDatabase:
    # Template for tenant database names
    nameTemplate: "optimal_tenant_{{ .TenantID }}"
    # Connection pool per tenant
    poolSize: 10
    # Auto-provision databases
    autoProvision: true

  # Keycloak realm configuration
  keycloak:
    # Template for tenant realm names
    realmTemplate: "optimal-{{ .TenantID }}"
    # Auto-create realms
    autoProvision: true
    # Default client configuration
    defaultClients:
      - name: optimal-portal
        publicClient: true
        redirectUris:
          - "https://{{ .TenantSubdomain }}.portal.gooptimal.io/*"
      - name: optimal-api
        publicClient: false
        serviceAccountsEnabled: true

  # Tenant subdomain configuration
  subdomain:
    enabled: true
    baseDomain: "gooptimal.io"
    # Auto-create DNS records (requires external-dns)
    autoDNS: true

  # Tenant resource quotas
  quotas:
    default:
      agents: 100
      scansPerDay: 1000
      storageGB: 50
      apiRequestsPerHour: 10000

# -----------------------------------------------------------------------------
# PostgreSQL (Bitnami)
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    postgresPassword: ""
    username: optimal_user
    password: ""
    database: optimal_platform
  primary:
    persistence:
      enabled: true
      size: 20Gi
  metrics:
    enabled: true

# -----------------------------------------------------------------------------
# Redis (Bitnami)
# -----------------------------------------------------------------------------
redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      enabled: true
      size: 5Gi
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 5Gi
  metrics:
    enabled: true

# -----------------------------------------------------------------------------
# Keycloak (Bitnami)
# -----------------------------------------------------------------------------
keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: ""
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hostname: keycloak.gooptimal.io
    tls: true
  postgresql:
    enabled: false
  externalDatabase:
    host: ""
    port: 5432
    database: keycloak
    user: optimal_user
    password: ""

# -----------------------------------------------------------------------------
# Monitoring Stack
# -----------------------------------------------------------------------------
monitoring:
  enabled: true
  
  prometheus:
    enabled: true
    retention: 15d
    storageSize: 50Gi
  
  grafana:
    enabled: true
    adminPassword: ""
    ingress:
      enabled: true
      hosts:
        - observability.gooptimal.io
      tls:
        - secretName: grafana-tls
          hosts:
            - observability.gooptimal.io

# -----------------------------------------------------------------------------
# Ingress Controller
# -----------------------------------------------------------------------------
ingressController:
  enabled: true
  controller:
    replicaCount: 2
    service:
      type: LoadBalancer
      annotations: {}

# -----------------------------------------------------------------------------
# Cert Manager
# -----------------------------------------------------------------------------
certManager:
  enabled: true
  email: "admin@gooptimal.io"
  
# -----------------------------------------------------------------------------
# Network Policies
# -----------------------------------------------------------------------------
networkPolicies:
  enabled: true

# -----------------------------------------------------------------------------
# Pod Security Standards
# -----------------------------------------------------------------------------
podSecurityStandards:
  enabled: true
  level: restricted

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "optimal-platform"
  annotations: {}

# -----------------------------------------------------------------------------
# Pod Disruption Budgets
# -----------------------------------------------------------------------------
podDisruptionBudgets:
  enabled: true
  minAvailable: 1

# -----------------------------------------------------------------------------
# Loki - Centralized Logging
# -----------------------------------------------------------------------------
loki:
  enabled: true
  namespace: logging
  replicas: 1

  image:
    repository: grafana/loki
    tag: "2.9.0"
    pullPolicy: IfNotPresent

  persistence:
    size: 10Gi
    storageClass: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  promtail:
    image:
      repository: grafana/promtail
      tag: "2.9.0"
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# -----------------------------------------------------------------------------
# Velero - Backup and Disaster Recovery
# -----------------------------------------------------------------------------
velero:
  enabled: true
  namespace: velero

  image:
    repository: velero/velero
    tag: "v1.12.0"
    pullPolicy: IfNotPresent

  # Cloud provider: aws, gcp, azure
  provider: ""

  # Credentials for cloud provider (base64 encoded)
  credentials: ""

  # Initialize plugin containers
  initContainers: true

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Backup storage location configuration
  backupStorageLocation:
    bucket: ""
    prefix: "optimal-backups"
    config: {}
    # AWS example:
    #   region: us-east-1
    # GCP example:
    #   project: your-project-id
    # Azure example:
    #   resourceGroup: your-resource-group
    #   storageAccount: your-storage-account

  # Volume snapshot location configuration
  volumeSnapshotLocation:
    config: {}
    # AWS example:
    #   region: us-east-1
    # GCP example:
    #   project: your-project-id
    # Azure example:
    #   resourceGroup: your-resource-group

  # Scheduled backups
  schedules:
    daily-backup:
      schedule: "0 2 * * *"  # 2 AM daily
      includedNamespaces:
        - optimal-system
        - keycloak
      ttl: 168h  # 7 days
    weekly-full:
      schedule: "0 3 * * 0"  # 3 AM Sunday
      includedNamespaces:
        - optimal-system
        - keycloak
        - monitoring
        - logging
      ttl: 720h  # 30 days

# -----------------------------------------------------------------------------
# Kyverno Policies - Security & Compliance
# -----------------------------------------------------------------------------
kyvernoPolicies:
  enabled: true

  # Validation failure action: Audit (report only) or Enforce (block)
  validationFailureAction: Audit

  # Namespaces to exclude from policies
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - kyverno
    - falco
    - ingress-nginx
    - cert-manager

  # Allowed image registries
  allowedRegistries:
    - "ghcr.io/*"
    - "docker.io/*"
    - "quay.io/*"
    - "registry.k8s.io/*"
    - "gcr.io/*"
    - "grafana/*"
    - "prom/*"
    - "falcosecurity/*"
    - "velero/*"
    - "bitnami/*"

# -----------------------------------------------------------------------------
# Outpost - Airgap Packaging Configuration
# -----------------------------------------------------------------------------
outpost:
  enabled: false

  # Images to include in airgap bundle
  images:
    - "ghcr.io/optimal-platform/portal:{{ .Values.portal.image.tag }}"
    - "ghcr.io/optimal-platform/api-gateway:{{ .Values.apiGateway.image.tag }}"
    - "quay.io/keycloak/keycloak:23.0"
    - "docker.io/bitnami/postgresql:15"
    - "docker.io/bitnami/redis:7.2"
    - "grafana/grafana:10.2.0"
    - "grafana/loki:2.9.0"
    - "grafana/promtail:2.9.0"
    - "prom/prometheus:v2.47.0"
    - "prom/alertmanager:v0.26.0"
    - "velero/velero:v1.12.0"
    - "ghcr.io/kyverno/kyverno:v1.11.0"
    - "falcosecurity/falco:0.36.0"

  # SBOM generation
  sbom:
    enabled: true
    format: spdx-json  # or cyclonedx-json

  # Bundle compression
  compression: gzip  # gzip, zstd, or xz






