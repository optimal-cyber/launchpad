{{- if .Values.velero.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.velero.namespace | default "velero" }}
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: optimal-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero
  namespace: {{ .Values.velero.namespace | default "velero" }}
  labels:
    app.kubernetes.io/name: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero
  labels:
    app.kubernetes.io/name: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: velero
    namespace: {{ .Values.velero.namespace | default "velero" }}
---
{{- if .Values.velero.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: velero-credentials
  namespace: {{ .Values.velero.namespace | default "velero" }}
  labels:
    app.kubernetes.io/name: velero
type: Opaque
data:
  cloud: {{ .Values.velero.credentials | b64enc }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero
  namespace: {{ .Values.velero.namespace | default "velero" }}
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: optimal-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velero
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velero
    spec:
      serviceAccountName: velero
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: velero
          image: "{{ .Values.velero.image.repository | default "velero/velero" }}:{{ .Values.velero.image.tag | default "v1.12.0" }}"
          imagePullPolicy: {{ .Values.velero.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /velero
          args:
            - server
            - --features=EnableCSI
          ports:
            - name: metrics
              containerPort: 8085
              protocol: TCP
          env:
            - name: VELERO_SCRATCH_DIR
              value: /scratch
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_LIBRARY_PATH
              value: /plugins
            {{- if .Values.velero.provider }}
            {{- if eq .Values.velero.provider "aws" }}
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud
            {{- else if eq .Values.velero.provider "gcp" }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /credentials/cloud
            {{- else if eq .Values.velero.provider "azure" }}
            - name: AZURE_CREDENTIALS_FILE
              value: /credentials/cloud
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.velero.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: scratch
              mountPath: /scratch
            {{- if .Values.velero.credentials }}
            - name: credentials
              mountPath: /credentials
            {{- end }}
      volumes:
        - name: plugins
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        {{- if .Values.velero.credentials }}
        - name: credentials
          secret:
            secretName: velero-credentials
        {{- end }}
      {{- if .Values.velero.initContainers }}
      initContainers:
        {{- if .Values.velero.provider }}
        {{- if eq .Values.velero.provider "aws" }}
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.8.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: plugins
              mountPath: /target
        {{- else if eq .Values.velero.provider "gcp" }}
        - name: velero-plugin-for-gcp
          image: velero/velero-plugin-for-gcp:v1.8.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: plugins
              mountPath: /target
        {{- else if eq .Values.velero.provider "azure" }}
        - name: velero-plugin-for-azure
          image: velero/velero-plugin-for-microsoft-azure:v1.8.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: plugins
              mountPath: /target
        {{- end }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: velero
  namespace: {{ .Values.velero.namespace | default "velero" }}
  labels:
    app.kubernetes.io/name: velero
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8085
      targetPort: metrics
  selector:
    app.kubernetes.io/name: velero
---
# Default BackupStorageLocation
{{- if .Values.velero.backupStorageLocation }}
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: {{ .Values.velero.namespace | default "velero" }}
spec:
  provider: {{ .Values.velero.provider }}
  objectStorage:
    bucket: {{ .Values.velero.backupStorageLocation.bucket }}
    {{- if .Values.velero.backupStorageLocation.prefix }}
    prefix: {{ .Values.velero.backupStorageLocation.prefix }}
    {{- end }}
  {{- if .Values.velero.backupStorageLocation.config }}
  config:
    {{- toYaml .Values.velero.backupStorageLocation.config | nindent 4 }}
  {{- end }}
{{- end }}
---
# Default VolumeSnapshotLocation
{{- if .Values.velero.volumeSnapshotLocation }}
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: default
  namespace: {{ .Values.velero.namespace | default "velero" }}
spec:
  provider: {{ .Values.velero.provider }}
  {{- if .Values.velero.volumeSnapshotLocation.config }}
  config:
    {{- toYaml .Values.velero.volumeSnapshotLocation.config | nindent 4 }}
  {{- end }}
{{- end }}
---
# Scheduled Backup
{{- if .Values.velero.schedules }}
{{- range $name, $schedule := .Values.velero.schedules }}
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.velero.namespace | default "velero" }}
spec:
  schedule: {{ $schedule.schedule | quote }}
  template:
    {{- if $schedule.includedNamespaces }}
    includedNamespaces:
      {{- toYaml $schedule.includedNamespaces | nindent 6 }}
    {{- end }}
    {{- if $schedule.excludedNamespaces }}
    excludedNamespaces:
      {{- toYaml $schedule.excludedNamespaces | nindent 6 }}
    {{- end }}
    {{- if $schedule.includedResources }}
    includedResources:
      {{- toYaml $schedule.includedResources | nindent 6 }}
    {{- end }}
    ttl: {{ $schedule.ttl | default "720h" }}
    storageLocation: default
    volumeSnapshotLocations:
      - default
---
{{- end }}
{{- end }}
{{- end }}
