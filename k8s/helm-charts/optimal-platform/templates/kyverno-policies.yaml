{{- if .Values.kyvernoPolicies.enabled }}
---
# Pod Security Standards - Require Run As Non-Root
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      that the `runAsNonRoot` field is set to `true`.
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Containers must run as non-root. Set spec.securityContext.runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
---
# Pod Security Standards - Disallow Privilege Escalation
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Privilege escalation is not allowed. Set allowPrivilegeEscalation to false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
---
# Pod Security Standards - Require Read-Only Root Filesystem
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-read-only-root-filesystem
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: read-only-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Root filesystem must be read-only. Set readOnlyRootFilesystem to true."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
---
# Pod Security Standards - Drop All Capabilities
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop All Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: drop-all
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Containers must drop ALL capabilities and may only add NET_BIND_SERVICE."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
---
# Resource Management - Require Resource Limits
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "CPU and memory limits are required for all containers."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
---
