              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
---
# Image Security - Disallow Latest Tag
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Image Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Using the 'latest' tag is not allowed. Please specify a version tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
---
# Image Security - Restrict Image Registries
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Image Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Images must come from allowed registries: {{ .Values.kyvernoPolicies.allowedRegistries | default (list "ghcr.io" "docker.io" "quay.io" "registry.k8s.io" "gcr.io") | join ", " }}"
        pattern:
          spec:
            containers:
              - image: "{{ .Values.kyvernoPolicies.allowedRegistries | default (list "ghcr.io/*" "docker.io/*" "quay.io/*" "registry.k8s.io/*" "gcr.io/*" "grafana/*" "prom/*" "falcosecurity/*" "velero/*" "bitnami/*") | join " | " }}"
---
# Best Practices - Require Labels
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod, Deployment, StatefulSet, DaemonSet
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Label 'app' is required on all resources."
        pattern:
          metadata:
            labels:
              app: "?*"
---
# Best Practices - Require Probes
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: require-liveness-readiness
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Liveness and readiness probes are required for all containers."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - livenessProbe:
                      periodSeconds: ">0"
                    readinessProbe:
                      periodSeconds: ">0"
---
# Network Security - Disallow Host Namespaces
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Sharing host namespaces (hostNetwork, hostIPC, hostPID) is not allowed."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostIPC): false
            =(hostPID): false
---
# Network Security - Disallow Host Ports
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow Host Ports
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ .Values.kyvernoPolicies.validationFailureAction | default "Audit" }}
  background: true
  rules:
    - name: host-ports
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Host ports are not allowed."
        pattern:
          spec:
            containers:
              - =(ports):
                  - =(hostPort): 0
---
# Mutation - Add Default Security Context
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-security-context
  annotations:
    policies.kyverno.io/title: Add Default Security Context
    policies.kyverno.io/category: Mutation
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
spec:
  background: false
  rules:
    - name: add-seccomp-profile
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
---
# Mutation - Add Default Labels
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-labels
  annotations:
    policies.kyverno.io/title: Add Default Labels
    policies.kyverno.io/category: Mutation
    policies.kyverno.io/severity: low
spec:
  background: false
  rules:
    - name: add-managed-by
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - Service
      {{- if .Values.kyvernoPolicies.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.kyvernoPolicies.excludeNamespaces | nindent 16 }}
      {{- end }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(app.kubernetes.io/managed-by): optimal-platform
{{- end }}
