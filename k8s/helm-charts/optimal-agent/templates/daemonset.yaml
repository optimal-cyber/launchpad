apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "optimal-agent.fullname" . }}
  labels:
    {{- include "optimal-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "optimal-agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.daemonset.updateStrategy | nindent 4 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "optimal-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "optimal-agent.serviceAccountName" . }}
      {{- if .Values.daemonset.priorityClassName }}
      priorityClassName: {{ .Values.daemonset.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # Platform connection
            - name: OPTIMAL_API_URL
              value: {{ .Values.platform.apiUrl | quote }}
            - name: OPTIMAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "optimal-agent.secretName" . }}
                  key: {{ .Values.platform.secretKeyRef }}

            # Agent identification
            - name: OPTIMAL_AGENT_NAME
              value: {{ .Values.agent.name | default "" | quote }}
            - name: OPTIMAL_ENVIRONMENT
              value: {{ .Values.agent.environment | quote }}
            - name: OPTIMAL_CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['kubernetes.io/cluster-name']
            - name: OPTIMAL_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OPTIMAL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPTIMAL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Capabilities
            - name: OPTIMAL_VULN_SCANNING
              value: {{ .Values.agent.capabilities.vulnerabilityScanning | quote }}
            - name: OPTIMAL_RUNTIME_SECURITY
              value: {{ .Values.agent.capabilities.runtimeSecurity | quote }}
            - name: OPTIMAL_SBOM_GENERATION
              value: {{ .Values.agent.capabilities.sbomGeneration | quote }}
            - name: OPTIMAL_COMPLIANCE_AUDITING
              value: {{ .Values.agent.capabilities.complianceAuditing | quote }}
            - name: OPTIMAL_SECRET_DETECTION
              value: {{ .Values.agent.capabilities.secretDetection | quote }}

            # Scan configuration
            - name: OPTIMAL_SCAN_INTERVAL
              value: {{ .Values.agent.scan.interval | quote }}
            - name: OPTIMAL_SCAN_ON_START
              value: {{ .Values.agent.scan.scanOnStart | quote }}
            - name: OPTIMAL_SEVERITY_THRESHOLD
              value: {{ .Values.agent.scan.severityThreshold | quote }}

            # Heartbeat
            - name: OPTIMAL_HEARTBEAT_INTERVAL
              value: {{ .Values.agent.heartbeatInterval | quote }}

            # Logging
            - name: OPTIMAL_LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}

            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.volumes.dockerSocket.enabled }}
            - name: docker-socket
              mountPath: /var/run/docker.sock
              readOnly: true
            {{- end }}
            {{- if .Values.volumes.containerdSocket.enabled }}
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            {{- end }}
            {{- if .Values.volumes.crioSocket.enabled }}
            - name: crio-socket
              mountPath: /var/run/crio/crio.sock
              readOnly: true
            {{- end }}
            {{- if .Values.volumes.hostFilesystem.enabled }}
            - name: host-filesystem
              mountPath: {{ .Values.volumes.hostFilesystem.mountPath }}
              readOnly: {{ .Values.volumes.hostFilesystem.readOnly }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        {{- if .Values.volumes.dockerSocket.enabled }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.volumes.dockerSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.volumes.containerdSocket.enabled }}
        - name: containerd-socket
          hostPath:
            path: {{ .Values.volumes.containerdSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.volumes.crioSocket.enabled }}
        - name: crio-socket
          hostPath:
            path: {{ .Values.volumes.crioSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.volumes.hostFilesystem.enabled }}
        - name: host-filesystem
          hostPath:
            path: {{ .Values.volumes.hostFilesystem.hostPath }}
            type: Directory
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
